# One command runs all of Keel:
#
#   docker compose up --build
#
# then open http://localhost:8080 (change the port with KEEL_PORT in .env).
# Sign in as demo.hr@factorial.co / password. See README.md.
#
# Everything is configured by defaults; to turn the AI features on, copy
# .env.example to .env and set OPENAI_API_KEY.
#
# A free Tunnelmole tunnel comes up alongside the app and prints a public
# https URL (for an outside MCP client, say) — db/api/web stay quiet in the
# foreground (`attach: false`, Compose 2.20+) so that link and each
# service's own Started/Healthy line aren't buried in request logs; nothing
# is lost, `docker compose logs api` (etc.) still has everything. Skip the
# tunnel with `docker compose up api web` (lists services explicitly).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - keel_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    attach: false

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # Rails signs sessions with this; any long random string works. Replace it
      # before exposing Keel to anyone (`openssl rand -hex 64`).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-keel-local-only-secret-change-me-before-you-deploy-0123456789abcdef0123456789abcdef0123456789abcdef}
      # Background jobs (Assemble, agent, evals) run inside the web process.
      SOLID_QUEUE_IN_PUMA: '1'
      # Load the Demo Factorial demo company on a blank database; "false" starts empty.
      SEED_DEMO: ${SEED_DEMO:-true}
      # "true" lets an hr_admin wipe the deployment back to Demo Factorial from Settings. Only for a public demo.
      DEMO_RESET: ${DEMO_RESET:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      # Encrypts stored integration credentials (Slack webhook, Google Calendar
      # tokens) at rest. Local-only defaults; replace before exposing Keel
      # beyond your machine (`bin/rails db:encryption:init` generates your own).
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY:-rv0wuvmYTMVQaAriKp2HnAxEU1lI3owR}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY:-WmENU7gr6NXidtOrqkOtZEaR4TnkHDEJ}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT:-zLWjNehXbANMjM25wQaEEULQDj2LOXqa}
      # Optional: connects Settings > Integrations to Google Calendar. Slack
      # needs no env setup — it's connected from inside the app.
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
    volumes:
      - keel_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/up || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start migrates and seeds the demo company.
      start_period: 120s
    attach: false

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${KEEL_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:alpine has no curl; busybox's wget is built in. 127.0.0.1, not
      # localhost — nginx only binds the IPv4 socket, and this image
      # resolves "localhost" to ::1 first, so wget would get a refused
      # connection on the (unbound) IPv6 one.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/up || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    attach: false

  # Gives Keel a public https URL via Tunnelmole (MIT-licensed client, no
  # account needed) — mainly so an outside MCP client can reach /mcp without
  # port-forwarding or a real deployment. Shares web's network namespace
  # rather than reaching it over Compose's service DNS, since tmole only
  # ever forwards to "localhost" and there's no first-party Tunnelmole
  # image to configure otherwise. The public URL prints to this service's
  # own log, which is why it's the one service left attached.
  tunnel:
    image: node:22-alpine
    network_mode: 'service:web'
    depends_on:
      web:
        condition: service_healthy
    command: sh -c "npm install --global tunnelmole >/dev/null 2>&1 && tmole 80"
    restart: unless-stopped

volumes:
  keel_db:
  keel_storage:
