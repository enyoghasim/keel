# One command runs all of Keel:
#
#   docker compose up --build
#
# then open http://localhost:8080 (change the port with KEEL_PORT in .env).
# Sign in as ifeoma.adeyemi@nubo.test / password. See README.md.
#
# Everything is configured by defaults; to turn the AI features on, copy
# .env.example to .env and set OPENAI_API_KEY.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - keel_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # Rails signs sessions with this; any long random string works. Replace it
      # before exposing Keel to anyone (`openssl rand -hex 64`).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-keel-local-only-secret-change-me-before-you-deploy-0123456789abcdef0123456789abcdef0123456789abcdef}
      # Background jobs (Assemble, agent, evals) run inside the web process.
      SOLID_QUEUE_IN_PUMA: '1'
      # Load the Nubo Logistics demo company on a blank database; "false" starts empty.
      SEED_DEMO: ${SEED_DEMO:-true}
      # "true" lets an hr_admin wipe the deployment back to Nubo Logistics from Settings. Only for a public demo.
      DEMO_RESET: ${DEMO_RESET:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    volumes:
      - keel_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/up || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start migrates and seeds the demo company.
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${KEEL_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  keel_db:
  keel_storage:
