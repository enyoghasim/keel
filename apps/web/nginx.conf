server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Roster CSVs and handbook PDFs are uploaded through here.
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # $http_host keeps the browser's port, which Action Cable's origin check compares.
    location /api {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assemble's browser-direct file uploads (Active Storage).
    location /rails/active_storage {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cable {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Keel's MCP server (SPEC.md section 13), for Claude Desktop and friends.
    location /mcp {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location = /up {
        proxy_pass http://api:80;
    }
}
