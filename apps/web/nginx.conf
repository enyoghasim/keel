# nginx itself never terminates TLS here — whatever sits in front of it
# (Tunnelmole, Coolify, Dokploy, ...) does, forwarding plain HTTP to this
# container. $scheme is always "http" from nginx's own point of view, so
# blindly setting X-Forwarded-Proto to it (as opposed to forwarding what
# that front door already set) told Rails every request was insecure —
# generating http:// Active Storage URLs a browser on https:// then
# blocked as mixed content.
#
# Tunnelmole turned out not to be a case the header fix alone covers: it
# sets X-Forwarded-Proto to "http" itself (confirmed live, via a throwaway
# debug route) — it's reporting its own local forwarding leg to this
# container, not the public https side a browser actually sees. Its own
# domain is a reliable tell on its own, so Host wins there outright;
# otherwise prefer whatever a real front door (Coolify, Dokploy, ...) set,
# falling back to $scheme only for a direct, proxy-less request.
map $http_host $tunnelmole_https {
    default                "";
    "~*\.tunnelmole\.net$" "https";
}

map $http_x_forwarded_proto $proxied_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $tunnelmole_https $forwarded_proto {
    default $tunnelmole_https;
    ''      $proxied_proto;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Roster CSVs and handbook PDFs are uploaded through here.
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # $http_host keeps the browser's port, which Action Cable's origin check compares.
    location /api {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Assemble's browser-direct file uploads (Active Storage).
    location /rails/active_storage {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /cable {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }

    # Keel's MCP server (SPEC.md section 13), for Claude Desktop and friends.
    location /mcp {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }

    location = /up {
        proxy_pass http://api:80;
    }
}
